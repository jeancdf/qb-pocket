<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QB Pocket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="scorebug" class="scorebug">
        <span class="scorebug__team">
          HOME <b id="home-score">0</b>
        </span>
        <span class="scorebug__team scorebug__team--away">
          AWAY <b id="away-score">0</b>
        </span>
        <span id="cover-call" class="scorebug__cover">COVER 3</span>
        <span id="play-chip" class="scorebug__play">SMASH</span>
        <span id="down-line" class="scorebug__down">
          1ST &amp; 10 · OWN 10
        </span>
        <span id="yards-chip" class="scorebug__yards">90 YDS</span>
        <span id="pocket" class="scorebug__pocket"></span>
      </div>
      <p id="read-hint" class="read-hint">Read the safeties, then audible.</p>

      <div id="audibles" class="audibles"></div>

      <div id="play-bar" class="play-bar">
        <button id="snap-btn" type="button">SNAP</button>
        <button id="reset-btn" type="button" class="ghost">RESET</button>
        <p class="play-bar__hint">
          1–4 audible · M motion · ZQSD scramble ·
          click throw · Space snap
        </p>
      </div>

      <aside id="hud" class="hud" hidden>
        <header class="hud__top">
          <div>
            <p class="hud__kicker">Playbook</p>
            <h1 id="play-title">GUN TRIPS RT</h1>
            <p id="play-name" class="hud__play">Play: Smash</p>
          </div>
        </header>
        <section>
          <p class="hud__label">Eligible receivers</p>
          <ul id="receiver-list" class="receivers"></ul>
        </section>
        <p id="status" class="hud__status"></p>
      </aside>

      <div id="result" class="result" hidden>
        <p id="result-kicker" class="result__kicker">TOUCHDOWN</p>
        <p id="result-title" class="result__title">YOU WIN</p>
        <p class="result__hint">R — drive again from the 10</p>
      </div>

      <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
